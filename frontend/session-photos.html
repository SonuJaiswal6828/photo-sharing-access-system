<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Photos - PhotoShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-10">
    <div class="mb-8">
      <h1 class="text-4xl font-bold mb-2 text-white">Shared Photos</h1>
      <p class="text-gray-400">Photos you have temporary access to</p>
    </div>

    <div id="content">
      <div class="spinner"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      document.getElementById("content").innerHTML = `
        <div class="bg-card border border-red-500/30 rounded-2xl p-16 text-center">
          <div class="text-5xl mb-4">❌</div>
          <h3 class="text-xl font-bold mb-2 text-white">No token provided</h3>
          <p class="text-gray-400 mb-6">You need a valid session token to view photos.</p>
          <a href="request-status.html" class="btn-primary inline-block">Check your status</a>
        </div>`;
    } else {
      loadPhotos();
    }

    async function loadPhotos() {
      try {
        const photos = await api.get(`/session/${token}/photos`);
        const content = document.getElementById("content");

        if (photos.length === 0) {
          content.innerHTML = `
            <div class="bg-card border border-border rounded-2xl p-16 text-center">
              <div class="text-5xl mb-4">🖼️</div>
              <h3 class="text-xl font-bold mb-2 text-white">No photos available</h3>
              <p class="text-gray-400">This group has no photos yet.</p>
            </div>`;
          return;
        }

        content.innerHTML = `
          <div class="bg-card border border-border rounded-xl p-4 mb-6 flex items-center gap-3">
            <span class="text-2xl">🔓</span>
            <div>
              <p class="font-medium text-white text-sm">Session Active</p>
              <p class="text-xs text-gray-400">${photos.length} photo${photos.length !== 1 ? 's' : ''} available · Expires in 1 hour</p>
            </div>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            ${photos.map(p => `
              <div class="photo-card bg-card border border-border rounded-xl overflow-hidden group">
                <div class="relative">
                  <img src="${p.file_url}" alt="photo" class="w-full h-48 object-cover" />
                  <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-3">
                    <a href="${p.file_url}" target="_blank" class="bg-white/20 backdrop-blur text-white px-3 py-2 rounded-lg text-sm hover:bg-white/30 transition">
                      🔍 View
                    </a>
                    <a href="${p.file_url}" download class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded-lg text-sm transition">
                      ⬇️ Download
                    </a>
                  </div>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      } catch (err) {
        document.getElementById("content").innerHTML = `
          <div class="bg-card border border-red-500/30 rounded-2xl p-16 text-center">
            <div class="text-5xl mb-4">❌</div>
            <h3 class="text-xl font-bold mb-2 text-white">Unable to load photos</h3>
            <p class="text-gray-400 mb-6">${err.message}</p>
            <a href="request-status.html" class="btn-primary inline-block">Check your status</a>
          </div>`;
      }
    }
  </script>
</body>
</html>
