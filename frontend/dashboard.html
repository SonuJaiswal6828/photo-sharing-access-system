<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - PhotoShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-10">
    <div class="mb-10">
      <h1 class="text-4xl font-bold mb-2 text-white">Dashboard</h1>
      <p class="text-gray-400">Overview of your photo sharing activity</p>
    </div>

    <!-- Stats -->
    <div id="stats" class="grid md:grid-cols-3 gap-5 mb-10">
      <div class="spinner"></div>
    </div>

    <!-- Recent Groups -->
    <div class="bg-card border border-border rounded-2xl p-6 mb-6">
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-xl font-bold text-white">Recent Groups</h2>
        <a href="groups.html" class="text-sm text-purple-400 hover:text-purple-300 transition">View all →</a>
      </div>
      <div id="recentGroups"><div class="spinner"></div></div>
    </div>

    <!-- Recent Pending Requests -->
    <div class="bg-card border border-border rounded-2xl p-6">
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-xl font-bold text-white">Pending Requests</h2>
        <a href="pending.html" class="text-sm text-purple-400 hover:text-purple-300 transition">View all →</a>
      </div>
      <div id="recentPending"><div class="spinner"></div></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();
    requireLogin();

    async function loadDashboard() {
      try {
        const [groups, pending] = await Promise.all([
          api.get("/group/"),
          api.get("/access-request/pending"),
        ]);

        // Stats
        document.getElementById("stats").innerHTML = `
          <div class="bg-card border border-border rounded-2xl p-6 flex items-center gap-5 hover:border-purple-600/50 transition">
            <div class="w-14 h-14 bg-gradient-to-br from-purple-600/20 to-indigo-600/20 border border-purple-600/30 rounded-xl flex items-center justify-center text-2xl">📁</div>
            <div>
              <p class="text-gray-400 text-sm mb-1">Total Groups</p>
              <p class="text-3xl font-bold text-white">${groups.length}</p>
            </div>
          </div>
          <div class="bg-card border border-border rounded-2xl p-6 flex items-center gap-5 hover:border-purple-600/50 transition">
            <div class="w-14 h-14 bg-gradient-to-br from-yellow-600/20 to-orange-600/20 border border-yellow-600/30 rounded-xl flex items-center justify-center text-2xl">⏳</div>
            <div>
              <p class="text-gray-400 text-sm mb-1">Pending Requests</p>
              <p class="text-3xl font-bold text-white">${pending.length}</p>
            </div>
          </div>
          <div class="bg-card border border-border rounded-2xl p-6 flex items-center gap-5 hover:border-purple-600/50 transition">
            <div class="w-14 h-14 bg-gradient-to-br from-green-600/20 to-emerald-600/20 border border-green-600/30 rounded-xl flex items-center justify-center text-2xl">✅</div>
            <div>
              <p class="text-gray-400 text-sm mb-1">Active</p>
              <p class="text-3xl font-bold text-white">${groups.length > 0 ? "Yes" : "—"}</p>
            </div>
          </div>
        `;

        // Recent groups
        const recentGroups = document.getElementById("recentGroups");
        if (groups.length === 0) {
          recentGroups.innerHTML = `
            <div class="text-center py-10">
              <p class="text-gray-400 mb-4">No groups yet</p>
              <a href="groups.html" class="btn-primary inline-block">Create your first group</a>
            </div>`;
        } else {
          recentGroups.innerHTML = `
            <div class="space-y-2">
              ${groups.slice(0, 5).map(g => `
                <a href="group-detail.html?id=${g.id}" class="flex justify-between items-center p-3 rounded-lg hover:bg-white/5 transition">
                  <div class="flex items-center gap-3">
                    <span class="w-9 h-9 bg-purple-600/20 border border-purple-600/30 rounded-lg flex items-center justify-center text-sm">📁</span>
                    <span class="font-medium text-white">${g.name}</span>
                  </div>
                  <span class="text-xs text-gray-400 font-mono bg-white/5 px-2 py-1 rounded">${g.group_code}</span>
                </a>
              `).join("")}
            </div>`;
        }

        // Recent pending
        const recentPending = document.getElementById("recentPending");
        if (pending.length === 0) {
          recentPending.innerHTML = `<p class="text-gray-400 text-center py-6">No pending requests</p>`;
        } else {
          recentPending.innerHTML = `
            <div class="space-y-2">
              ${pending.slice(0, 5).map(r => `
                <a href="pending.html" class="flex justify-between items-center p-3 rounded-lg hover:bg-white/5 transition">
                  <div class="flex items-center gap-3">
                    <span class="w-9 h-9 bg-yellow-600/20 border border-yellow-600/30 rounded-lg flex items-center justify-center text-sm">⏳</span>
                    <div>
                      <p class="font-medium text-white text-sm">${r.group_code}</p>
                      <p class="text-xs text-gray-500">Code: ${r.request_code}</p>
                    </div>
                  </div>
                  <span class="text-xs px-3 py-1 bg-yellow-600/20 border border-yellow-600/30 text-yellow-400 rounded-full">pending</span>
                </a>
              `).join("")}
            </div>`;
        }
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    loadDashboard();
  </script>
</body>
</html>
