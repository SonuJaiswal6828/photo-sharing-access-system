<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Sections - PhotoShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-10">
    <a href="groups.html" class="text-sm text-gray-400 hover:text-purple-400 transition mb-6 inline-flex items-center gap-1">
      ← Back to Groups
    </a>

    <div class="flex justify-between items-center mb-8 flex-wrap gap-4">
      <div>
        <h1 class="text-4xl font-bold mb-2 text-white" id="groupTitle">Sections</h1>
        <p class="text-gray-400">Manage sections within this group</p>
      </div>
      <button onclick="openCreateModal()" class="btn-primary flex items-center gap-2">
        <span class="text-lg">+</span> Create Section
      </button>
    </div>

    <div id="sectionsGrid">
      <div class="spinner"></div>
    </div>
  </main>

  <div id="footer"></div>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-card border border-border rounded-2xl p-8 w-full max-w-md">
      <h2 id="modalTitle" class="text-2xl font-bold mb-6 text-white">Create Section</h2>
      <div id="modalError" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm p-3 rounded-lg mb-5"></div>
      <form id="sectionForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Section Name</label>
          <input type="text" id="sectionName" class="input-field" placeholder="e.g. Haldi, Reception" required />
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="btn-secondary flex-1">Cancel</button>
          <button type="submit" id="modalSubmit" class="btn-primary flex-1">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();
    requireLogin();

    const params = new URLSearchParams(window.location.search);
    const groupId = params.get("id");
    let editingId = null;

    if (!groupId) {
      window.location.href = "groups.html";
    }

    async function loadSections() {
      try {
        const sections = await api.get(`/group/${groupId}/sections`);
        const grid = document.getElementById("sectionsGrid");

        if (sections.length === 0) {
          grid.innerHTML = `
            <div class="bg-card border border-border rounded-2xl p-16 text-center">
              <div class="text-5xl mb-4">📂</div>
              <h3 class="text-xl font-bold mb-2 text-white">No sections yet</h3>
              <p class="text-gray-400 mb-6">Create a section to organize photos</p>
              <button onclick="openCreateModal()" class="btn-primary">Create Section</button>
            </div>`;
          return;
        }

        grid.innerHTML = `<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
          ${sections.map(s => `
            <div class="bg-card border border-border rounded-2xl p-6 hover:border-purple-600/50 transition group">
              <div class="w-12 h-12 bg-purple-600/20 border border-purple-600/30 rounded-xl flex items-center justify-center text-xl mb-4">📂</div>
              <h3 class="text-lg font-bold text-white mb-1">${s.name}</h3>
              <p class="text-xs text-gray-500 mb-5">Created ${new Date(s.created_at).toLocaleDateString()}</p>
              <div class="flex gap-2">
                <a href="section-detail.html?id=${s.id}&group_id=${groupId}" class="flex-1 text-center py-2 px-3 bg-purple-600/20 border border-purple-600/40 text-purple-300 hover:bg-purple-600/30 rounded-lg text-sm font-medium transition">
                  View Photos
                </a>
                <button onclick="openEditModal(${s.id}, '${s.name.replace(/'/g, "\\'")}')" class="py-2 px-3 bg-white/5 border border-white/10 text-gray-300 hover:bg-white/10 rounded-lg text-sm transition">✏️</button>
                <button onclick="deleteSection(${s.id})" class="py-2 px-3 bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 rounded-lg text-sm transition">🗑️</button>
              </div>
            </div>
          `).join("")}
        </div>`;
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    function openCreateModal() {
      editingId = null;
      document.getElementById("modalTitle").textContent = "Create Section";
      document.getElementById("modalSubmit").textContent = "Create";
      document.getElementById("sectionName").value = "";
      document.getElementById("modalError").classList.add("hidden");
      document.getElementById("modal").classList.remove("hidden");
    }

    function openEditModal(id, name) {
      editingId = id;
      document.getElementById("modalTitle").textContent = "Edit Section";
      document.getElementById("modalSubmit").textContent = "Save";
      document.getElementById("sectionName").value = name;
      document.getElementById("modalError").classList.add("hidden");
      document.getElementById("modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
      editingId = null;
    }

    document.getElementById("sectionForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("modalSubmit");
      const errBox = document.getElementById("modalError");
      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Saving...";

      try {
        const name = document.getElementById("sectionName").value.trim();
        if (editingId) {
          await api.patch(`/section/${editingId}`, { name });
          showToast("Section updated", "success");
        } else {
          await api.post("/section/create", { group_id: parseInt(groupId), name });
          showToast("Section created", "success");
        }
        closeModal();
        loadSections();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = editingId ? "Save" : "Create";
      }
    });

    async function deleteSection(id) {
      if (!confirm("Delete this section and all its photos?")) return;
      try {
        await api.delete(`/section/${id}`);
        showToast("Section deleted", "success");
        loadSections();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    loadSections();
  </script>
</body>
</html>
