<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - PhotoShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
        }
      }
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">Welcome back</h1>
        <p class="text-gray-400">Sign in to your admin account</p>
      </div>

      <div class="bg-card border border-border rounded-2xl p-8">
        <div id="error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm p-3 rounded-lg mb-5"></div>

        <form id="loginForm" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Username</label>
            <input type="text" id="username" class="input-field" placeholder="Enter your username" required />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
            <input type="password" id="password" class="input-field" placeholder="Enter your password" required />
          </div>

          <button type="submit" id="submitBtn" class="btn-primary w-full">
            Sign In
          </button>
        </form>

        <p class="text-center text-sm text-gray-400 mt-6">
          Don't have an account?
          <a href="signup.html" class="text-purple-400 hover:text-purple-300 font-medium">Sign up</a>
        </p>
      </div>

      <p class="text-center text-xs text-gray-500 mt-6">
        🔒 Your data is protected with JWT authentication
      </p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();

    if (isLoggedIn()) {
      window.location.href = "dashboard.html";
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const errorBox = document.getElementById("error");
      errorBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const data = await api.post("/admin/login", {
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
        });
        setToken(data.access_token);
        showToast("Login successful!", "success");
        setTimeout(() => window.location.href = "dashboard.html", 600);
      } catch (err) {
        errorBox.textContent = err.message || "Login failed";
        errorBox.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
