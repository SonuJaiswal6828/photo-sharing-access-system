<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groups - PhotoShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-10">
    <div class="flex justify-between items-center mb-8 flex-wrap gap-4">
      <div>
        <h1 class="text-4xl font-bold mb-2 text-white">My Groups</h1>
        <p class="text-gray-400">Organize your photos into groups</p>
      </div>
      <button onclick="openCreateModal()" class="btn-primary flex items-center gap-2">
        <span class="text-lg">+</span> Create Group
      </button>
    </div>

    <div id="groupsGrid">
      <div class="spinner"></div>
    </div>
  </main>

  <div id="footer"></div>

  <!-- Create/Edit Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-card border border-border rounded-2xl p-8 w-full max-w-md">
      <h2 id="modalTitle" class="text-2xl font-bold mb-6 text-white">Create Group</h2>
      <div id="modalError" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm p-3 rounded-lg mb-5"></div>
      <form id="groupForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Group Name</label>
          <input type="text" id="groupName" class="input-field" placeholder="e.g. Wedding 2026" required />
        </div>
        <div id="passwordField">
          <label class="block text-sm font-medium text-gray-300 mb-2">Group Password</label>
          <input type="password" id="groupPassword" class="input-field" placeholder="Password for friends to request access" required minlength="4" />
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="btn-secondary flex-1">Cancel</button>
          <button type="submit" id="modalSubmit" class="btn-primary flex-1">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();
    requireLogin();

    let editingId = null;

    async function loadGroups() {
      try {
        const groups = await api.get("/group/");
        const grid = document.getElementById("groupsGrid");

        if (groups.length === 0) {
          grid.innerHTML = `
            <div class="bg-card border border-border rounded-2xl p-16 text-center">
              <div class="text-5xl mb-4">📁</div>
              <h3 class="text-xl font-bold mb-2 text-white">No groups yet</h3>
              <p class="text-gray-400 mb-6">Create your first group to start sharing photos</p>
              <button onclick="openCreateModal()" class="btn-primary">Create Group</button>
            </div>`;
          return;
        }

        grid.innerHTML = `<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
          ${groups.map(g => `
            <div class="bg-card border border-border rounded-2xl p-6 hover:border-purple-600/50 transition group">
              <div class="flex justify-between items-start mb-4">
                <div class="w-12 h-12 bg-purple-600/20 border border-purple-600/30 rounded-xl flex items-center justify-center text-xl">📁</div>
                <span class="text-xs text-gray-400 font-mono bg-white/5 px-2 py-1 rounded">${g.group_code}</span>
              </div>
              <h3 class="text-lg font-bold text-white mb-1">${g.name}</h3>
              <p class="text-xs text-gray-500 mb-5">Created ${new Date(g.created_at).toLocaleDateString()}</p>
              <div class="flex gap-2">
                <a href="group-detail.html?id=${g.id}" class="flex-1 text-center py-2 px-3 bg-purple-600/20 border border-purple-600/40 text-purple-300 hover:bg-purple-600/30 rounded-lg text-sm font-medium transition">
                  View
                </a>
                <button onclick="openEditModal(${g.id}, '${g.name.replace(/'/g, "\\'")}')" class="py-2 px-3 bg-white/5 border border-white/10 text-gray-300 hover:bg-white/10 rounded-lg text-sm transition">
                  ✏️
                </button>
                <button onclick="deleteGroup(${g.id})" class="py-2 px-3 bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 rounded-lg text-sm transition">
                  🗑️
                </button>
              </div>
            </div>
          `).join("")}
        </div>`;
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    function openCreateModal() {
      editingId = null;
      document.getElementById("modalTitle").textContent = "Create Group";
      document.getElementById("modalSubmit").textContent = "Create";
      document.getElementById("groupName").value = "";
      document.getElementById("groupPassword").value = "";
      document.getElementById("passwordField").style.display = "block";
      document.getElementById("groupPassword").required = true;
      document.getElementById("modalError").classList.add("hidden");
      document.getElementById("modal").classList.remove("hidden");
    }

    function openEditModal(id, name) {
      editingId = id;
      document.getElementById("modalTitle").textContent = "Edit Group";
      document.getElementById("modalSubmit").textContent = "Save";
      document.getElementById("groupName").value = name;
      document.getElementById("passwordField").style.display = "none";
      document.getElementById("groupPassword").required = false;
      document.getElementById("modalError").classList.add("hidden");
      document.getElementById("modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
      editingId = null;
    }

    document.getElementById("groupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("modalSubmit");
      const errBox = document.getElementById("modalError");
      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Saving...";

      try {
        const name = document.getElementById("groupName").value.trim();

        if (editingId) {
          await api.patch(`/group/${editingId}`, { name });
          showToast("Group updated", "success");
        } else {
          const password = document.getElementById("groupPassword").value;
          await api.post("/group/create", { name, password });
          showToast("Group created", "success");
        }

        closeModal();
        loadGroups();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = editingId ? "Save" : "Create";
      }
    });

    async function deleteGroup(id) {
      if (!confirm("Delete this group? All sections and photos will also be deleted.")) return;
      try {
        await api.delete(`/group/${id}`);
        showToast("Group deleted", "success");
        loadGroups();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    loadGroups();
  </script>
</body>
</html>
