<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Access - PhotoShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-gradient-to-br from-purple-600 to-indigo-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-5 shadow-lg shadow-purple-900/40">
          🔓
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">Request Access</h1>
        <p class="text-gray-400">Enter group code and password to request access</p>
      </div>

      <div class="bg-card border border-border rounded-2xl p-8">
        <div id="error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm p-3 rounded-lg mb-5"></div>

        <!-- Form -->
        <form id="requestForm" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Group Code</label>
            <input type="text" id="groupCode" class="input-field" placeholder="e.g. ET8BXD" required />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Group Password</label>
            <input type="password" id="groupPassword" class="input-field" placeholder="Enter group password" required />
          </div>

          <button type="submit" id="submitBtn" class="btn-primary w-full">
            Request Access
          </button>
        </form>

        <!-- Success -->
        <div id="success" class="hidden">
          <div class="text-center mb-6">
            <div class="w-16 h-16 bg-green-500/20 border border-green-500/40 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">✅</div>
            <h2 class="text-xl font-bold text-white mb-2">Request Submitted!</h2>
            <p class="text-gray-400 text-sm">Save this Request Code to check your status</p>
          </div>

          <div class="bg-bg border border-purple-600/40 rounded-xl p-6 mb-6 text-center">
            <p class="text-xs text-gray-500 mb-2 uppercase tracking-wider">Your Request Code</p>
            <p id="requestCodeDisplay" class="text-4xl font-bold text-purple-400 tracking-[0.3em]"></p>
          </div>

          <p class="text-xs text-gray-500 text-center mb-5">
            ⚠️ You'll need this code to check your request status
          </p>

          <a href="request-status.html" class="btn-primary w-full block text-center">
            Check Status
          </a>
        </div>
      </div>

      <p class="text-center text-sm text-gray-500 mt-6">
        Already have a request code?
        <a href="request-status.html" class="text-purple-400 hover:text-purple-300 font-medium">Check status</a>
      </p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();

    document.getElementById("requestForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const errBox = document.getElementById("error");
      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Submitting...";

      try {
        const data = await api.post("/access-request/create", {
          group_code: document.getElementById("groupCode").value.trim(),
          group_password: document.getElementById("groupPassword").value,
        });

        document.getElementById("requestCodeDisplay").textContent = data.request_code;
        document.getElementById("requestForm").classList.add("hidden");
        document.getElementById("success").classList.remove("hidden");
        showToast("Request submitted!", "success");
      } catch (err) {
        errBox.textContent = err.message || "Request failed";
        errBox.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Request Access";
      }
    });
  </script>
</body>
</html>
