<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Requests - PhotoShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-10">
    <div class="mb-8">
      <h1 class="text-4xl font-bold mb-2 text-white">Pending Requests</h1>
      <p class="text-gray-400">Approve or reject access requests from friends</p>
    </div>

    <div id="requestsList">
      <div class="spinner"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();
    requireLogin();

    async function loadRequests() {
      try {
        const requests = await api.get("/access-request/pending");
        const list = document.getElementById("requestsList");

        if (requests.length === 0) {
          list.innerHTML = `
            <div class="bg-card border border-border rounded-2xl p-16 text-center">
              <div class="text-5xl mb-4">✅</div>
              <h3 class="text-xl font-bold mb-2 text-white">All caught up!</h3>
              <p class="text-gray-400">No pending requests right now</p>
            </div>`;
          return;
        }

        list.innerHTML = `<div class="space-y-3">
          ${requests.map(r => {
            const isExpired = new Date(r.expires_at + "Z") < new Date();
            return `
            <div class="bg-card border border-border rounded-xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 ${isExpired ? 'opacity-60' : ''}">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 ${isExpired ? 'bg-gray-600/20 border-gray-600/30' : 'bg-yellow-600/20 border-yellow-600/30'} border rounded-xl flex items-center justify-center text-xl">
                  ${isExpired ? '⏰' : '⏳'}
                </div>
                <div>
                  <div class="flex items-center gap-2 mb-1">
                    <h3 class="font-bold text-white">${r.group_code}</h3>
                    <span class="text-xs px-2 py-0.5 ${isExpired ? 'bg-gray-600/20 text-gray-400' : 'bg-yellow-600/20 text-yellow-400'} rounded-full">
                      ${isExpired ? 'expired' : r.status}
                    </span>
                  </div>
                  <p class="text-xs text-gray-500">Code: <span class="font-mono text-gray-300">${r.request_code}</span></p>
                  <p class="text-xs text-gray-500">Requested: ${new Date(r.requested_at).toLocaleString()}</p>
                </div>
              </div>
              <div class="flex gap-2">
                <button onclick="approveRequest(${r.id})" ${isExpired ? 'disabled' : ''}
                        class="px-5 py-2 rounded-lg text-sm font-medium transition ${isExpired
                          ? 'bg-gray-600/20 text-gray-500 cursor-not-allowed'
                          : 'bg-green-600/20 border border-green-600/40 text-green-400 hover:bg-green-600/30'}">
                  Approve
                </button>
                <button onclick="rejectRequest(${r.id})"
                        class="px-5 py-2 rounded-lg text-sm font-medium transition bg-red-600/20 border border-red-600/40 text-red-400 hover:bg-red-600/30">
                  Reject
                </button>
              </div>
            </div>
          `;
          }).join("")}
        </div>`;
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function approveRequest(id) {
      try {
        const session = await api.patch(`/access-request/${id}/approve`);
        showToast(`Session created! Token: ${session.session_token.slice(0, 12)}...`, "success");
        loadRequests();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function rejectRequest(id) {
      if (!confirm("Reject this request?")) return;
      try {
        await api.patch(`/access-request/${id}/reject`);
        showToast("Request rejected", "success");
        loadRequests();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    loadRequests();
  </script>
</body>
</html>
