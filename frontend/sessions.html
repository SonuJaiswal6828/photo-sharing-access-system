<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sessions - PhotoShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-10">
    <div class="mb-8">
      <h1 class="text-4xl font-bold mb-2 text-white">Sessions</h1>
      <p class="text-gray-400">Manage active photo access sessions</p>
    </div>

    <!-- Stats -->
    <div id="stats" class="grid grid-cols-3 gap-4 mb-8"></div>

    <!-- Sessions list -->
    <div id="sessionsList">
      <div class="spinner"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();
    requireLogin();

    const statusStyles = {
      active:  { bg: "bg-green-500/10", border: "border-green-500/30", text: "text-green-400", label: "Active", icon: "🟢" },
      expired: { bg: "bg-gray-500/10",  border: "border-gray-500/30",  text: "text-gray-400",  label: "Expired", icon: "⏰" },
      revoked: { bg: "bg-red-500/10",   border: "border-red-500/30",   text: "text-red-400",   label: "Revoked", icon: "🚫" },
    };

    async function loadSessions() {
      try {
        const sessions = await api.get("/session/all");
        const list = document.getElementById("sessionsList");

        // Stats
        const counts = { active: 0, expired: 0, revoked: 0 };
        sessions.forEach(s => counts[s.status] = (counts[s.status] || 0) + 1);

        document.getElementById("stats").innerHTML = `
          <div class="bg-card border border-green-500/30 rounded-xl p-4 text-center">
            <p class="text-3xl font-bold text-green-400">${counts.active}</p>
            <p class="text-xs text-gray-400 mt-1">Active</p>
          </div>
          <div class="bg-card border border-gray-500/30 rounded-xl p-4 text-center">
            <p class="text-3xl font-bold text-gray-400">${counts.expired}</p>
            <p class="text-xs text-gray-400 mt-1">Expired</p>
          </div>
          <div class="bg-card border border-red-500/30 rounded-xl p-4 text-center">
            <p class="text-3xl font-bold text-red-400">${counts.revoked}</p>
            <p class="text-xs text-gray-400 mt-1">Revoked</p>
          </div>
        `;

        if (sessions.length === 0) {
          list.innerHTML = `
            <div class="bg-card border border-border rounded-2xl p-16 text-center">
              <div class="text-5xl mb-4">🔐</div>
              <h3 class="text-xl font-bold mb-2 text-white">No sessions yet</h3>
              <p class="text-gray-400 mb-6">Approve a pending access request to create a session</p>
              <a href="pending.html" class="btn-primary inline-block">Go to Pending Requests</a>
            </div>`;
          return;
        }

        list.innerHTML = `
          <div class="space-y-3">
            ${sessions.map(s => {
              const style = statusStyles[s.status] || statusStyles.active;
              const created = new Date(s.created_at + "Z").toLocaleString();
              const expires = new Date(s.expire_time + "Z").toLocaleString();
              return `
                <div class="bg-card border border-border rounded-xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div class="flex-1">
                    <div class="flex items-center gap-3 mb-2">
                      <span class="w-10 h-10 ${style.bg} ${style.border} border rounded-lg flex items-center justify-center text-lg">${style.icon}</span>
                      <div>
                        <p class="font-bold text-white">${s.group_name} <span class="text-xs text-gray-500 font-mono">(${s.group_code})</span></p>
                        <p class="text-xs text-gray-500">Request: <span class="font-mono">${s.request_code}</span></p>
                      </div>
                      <span class="ml-auto text-xs px-3 py-1 ${style.bg} ${style.border} border ${style.text} rounded-full font-medium">${style.label}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs text-gray-500 mt-3">
                      <div><span class="text-gray-600">Created:</span> ${created}</div>
                      <div><span class="text-gray-600">Expires:</span> ${expires}</div>
                    </div>
                    <div class="mt-2 text-xs font-mono text-gray-600 bg-white/5 px-2 py-1 rounded inline-block break-all max-w-full">
                      ${s.session_token.slice(0, 24)}...
                    </div>
                  </div>
                  <div class="flex gap-2">
                    ${s.status === "active" ? `
                      <button onclick="revokeSession(${s.id})" class="btn-danger">Revoke</button>
                    ` : `
                      <span class="text-xs text-gray-600 px-3 py-2">No actions</span>
                    `}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      } catch (err) {
        showToast(err.message, "error");
        document.getElementById("sessionsList").innerHTML = `
          <div class="bg-card border border-red-500/30 rounded-2xl p-16 text-center">
            <div class="text-5xl mb-4">❌</div>
            <h3 class="text-xl font-bold mb-2 text-white">Error loading sessions</h3>
            <p class="text-gray-400">${err.message}</p>
          </div>`;
      }
    }

    async function revokeSession(id) {
      if (!confirm("Revoke this session? The friend will lose access immediately.")) return;
      try {
        await api.patch(`/session/${id}/revoke`);
        showToast("Session revoked", "success");
        loadSessions();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    loadSessions();
  </script>
</body>
</html>
